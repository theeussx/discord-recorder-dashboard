services:
  - type: web
    name: wardizitto-recordings
    env: node
    nodeVersion: 22.13.0
    buildCommand: npx pnpm install --no-frozen-lockfile && npx pnpm build
    startCommand: npx pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASS_HASH
        sync: false
      - key: BOT_API_BASE
        sync: false
      - key: VITE_BOT_API_BASE
        sync: false
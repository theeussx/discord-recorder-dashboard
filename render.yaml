services:
  - type: web
    name: wardizitto-recordings
    env: node
    nodeVersion: 22.13.0
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASS_HASH
        sync: false
      - key: BOT_API_BASE
        sync: false
      - key: VITE_BOT_API_BASE
        sync: false